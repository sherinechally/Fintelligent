[project]
name = "computer-use-automation"
version = "0.1.0"
description = "Understudy: an LLM learns a legacy back-office flow once; deterministic replay performs it thereafter, with policy holds and human handoff."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "playwright>=1.45",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
